server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver embebido de Docker. Con `set $upstream_api ...; proxy_pass
  # http://$upstream_api;` nginx resuelve el host EN CADA PETICIÓN en vez de
  # al arrancar — si "api" no existe en esta red (p.ej. despliegue en
  # EasyPanel con dominios separados, ver docs/EASYPANEL.md Opción B, donde
  # el navegador llama a la API directo vía VITE_API_URL y este proxy nunca
  # se usa), nginx igual arranca; solo /api/* respondería 502 si alguien lo
  # llamara. Sin esto, un host no resuelto al leer la config tumba nginx
  # entero ("host not found in upstream") y el contenedor entra en crash-loop.
  resolver 127.0.0.11 valid=10s;

  # Comprimir estáticos
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Cache largo para assets con hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API y health al servicio de la API (solo aplica en modo mismo-dominio,
  # Opción A del compose; ver comentario del resolver arriba).
  location /api/ {
    set $upstream_api api:3001;
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health {
    set $upstream_api api:3001;
    proxy_pass http://$upstream_api;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
